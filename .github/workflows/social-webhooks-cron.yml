name: Social Webhook Processing

on:
  workflow_dispatch:

jobs:
  webhooks:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Process stored Meta feed webhooks
        run: |
          HTTP_STATUS="$(curl --silent --show-error \
            --output /tmp/social-webhooks.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://gfvgo.com/api/cron/social-webhooks)"
          cat /tmp/social-webhooks.json
          test "$HTTP_STATUS" = "200"
