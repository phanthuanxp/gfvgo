name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Build-time placeholders only. No production credential is needed:
      # every page is server-rendered on demand, so nothing queries the
      # database during the build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-session-secret-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Linux security candidate (Next.js + Zod)
        run: npm install next@16.4.4 zod@4.6.6 --save-exact --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply Prisma baseline to new CI database
        run: npx prisma migrate deploy --config prisma/baseline.config.ts

      - name: Seed synthetic tenant and Social data
        env:
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: ci-only-synthetic-password
          SEED_SOCIAL_DEMO: "true"
        run: npm run seed

      - name: Collect non-sensitive database metadata
        run: npx tsx scripts/inspect-db-metadata.ts > /tmp/gfvgo-db-metadata.json

      - name: Backup and restore CI database
        env:
          PGPASSWORD: ci
        run: |
          pg_dump --format=plain --no-owner --file=/tmp/gfvgo-ci.sql "$DATABASE_URL"
          psql -h localhost -U ci -d postgres -c 'CREATE DATABASE gfvgo_restore'
          sed -i '/^SET transaction_timeout = 0;$/d' /tmp/gfvgo-ci.sql
          psql --set ON_ERROR_STOP=1 postgresql://ci:ci@localhost:5432/gfvgo_restore < /tmp/gfvgo-ci.sql
          psql -h localhost -U ci -d gfvgo_restore -c 'SELECT COUNT(*) FROM "Tenant"'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
