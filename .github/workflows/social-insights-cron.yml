name: Social Post Insights

on:
  workflow_dispatch:

jobs:
  insights:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync Facebook Page post insights
        run: |
          HTTP_STATUS="$(curl --silent --show-error \
            --output /tmp/social-insights.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://gfvgo.com/api/cron/social-insights)"
          cat /tmp/social-insights.json
          test "$HTTP_STATUS" = "200"
