name: Security remediation candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      TOKEN_ENCRYPTION_KEY: ci-only-token-encryption-key-32-characters
      META_APP_ID: ""
      META_APP_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install baseline lockfile
        run: npm ci
      - name: Apply candidate security group
        run: npm install next@16.4.4 zod@4.6.6 --save-exact --ignore-scripts
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --config prisma/baseline.config.ts
      - name: Synthetic seed
        env:
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: ci-only-synthetic-password
          SEED_SOCIAL_DEMO: "true"
        run: npm run seed
      - name: Backup and restore
        env:
          PGPASSWORD: ci
        run: |
          pg_dump --format=plain --no-owner --file=/tmp/gfvgo-ci.sql "$DATABASE_URL"
          psql -h localhost -U ci -d postgres -c 'CREATE DATABASE gfvgo_restore'
          psql --set ON_ERROR_STOP=1 postgresql://ci:ci@localhost:5432/gfvgo_restore < /tmp/gfvgo-ci.sql
          psql -h localhost -U ci -d gfvgo_restore -c 'SELECT COUNT(*) FROM "Tenant"'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit candidate
        run: npm audit --omit=dev --json > npm-audit-candidate.json || true
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gfvgo-security-remediation-candidate
          path: |
            package.json
            package-lock.json
            npm-audit-candidate.json
